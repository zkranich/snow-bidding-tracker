<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vendor Portal</title>
<style>
  :root{ --bg:#f3f5f8; --card:#fff; --ink:#14202e; --muted:#5b6b7d; --line:#d5dce5; --accent:#1c6e8c; --bad:#b3261e; --ok:#1e7a46; --warn:#9a6200; --row:#f7f9fb; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap{ max-width:720px; margin:0 auto; padding:16px 16px 56px; }
  h1{ font-size:22px; margin:6px 0 2px; } .sub{ color:var(--muted); margin:0 0 16px; }
  h2{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:22px 0 8px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .top{ display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
  .store{ font-weight:700; font-size:17px; }
  .pill{ display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; background:#e6ebf1; color:#33445a; white-space:nowrap; }
  .pill.go{ background:#d9f0e2; color:#14572f; } .pill.mid{ background:#fdecc8; color:#7a4f00; } .pill.bad{ background:#f6d6d3; color:#8a1d15; }
  .mapbtn{ display:inline-block; margin:0 0 8px; padding:5px 12px; border:1px solid var(--accent); border-radius:7px; color:var(--accent); font-size:13px; font-weight:600; text-decoration:none; }
  .info .mapbtn{ margin:0; padding:2px 10px; font-size:12.5px; }
  .addr a{ color:var(--accent); text-decoration:none; } .addr{ margin:2px 0 8px; }
  .svc{ font-weight:600; } .meta{ color:var(--muted); font-size:13px; }
  .info{ margin:10px 0 4px; background:var(--row); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:14px; }
  .info dt{ color:var(--muted); } .info dd{ margin:0; font-weight:600; word-break:break-word; }
  .info a{ color:var(--accent); text-decoration:none; }
  .gate{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; letter-spacing:.04em; }
  .locked{ color:var(--muted); font-weight:400; font-size:13px; }
  .notes{ margin:8px 0 0; font-size:13px; color:var(--muted); white-space:pre-wrap; }
  .issue{ margin:8px 0 0; font-size:13px; color:var(--bad); font-weight:600; }
  .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button{ font:inherit; font-weight:600; padding:11px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; min-height:44px; }
  button.p{ background:var(--accent); border-color:var(--accent); color:#fff; } button.ok{ background:var(--ok); border-color:var(--ok); color:#fff; }
  button.w{ color:var(--bad); } button:disabled{ opacity:.5; cursor:default; }
  textarea{ width:100%; font:inherit; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); margin-top:10px; min-height:70px; }
  .row-msg{ font-size:13px; margin-top:8px; min-height:16px; } .row-msg.bad{ color:var(--bad); } .row-msg.ok{ color:var(--ok); }
  .tabs{ display:flex; gap:6px; margin:4px 0 14px; } .tabs button{ flex:1; min-height:42px; } .tabs button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .srch{ width:100%; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); margin-bottom:12px; }
  .srch:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .card.tap{ cursor:pointer; } .card.tap:active{ background:var(--row); }
  .chev{ color:var(--muted); font-size:20px; line-height:1; margin-left:4px; }
  .back{ background:none; border:0; color:var(--accent); padding:8px 0; min-height:40px; font-weight:600; }
  .when{ margin:6px 0 0; font-size:13px; color:var(--muted); }
  .tl{ margin:12px 0 4px; border-left:2px solid var(--line); padding-left:12px; display:grid; gap:6px; font-size:14px; }
  .tl div span{ color:var(--muted); display:inline-block; min-width:92px; } .tl b{ font-weight:600; }
  .comp{ margin-top:12px; border-top:1px solid var(--line); padding-top:4px; } .comp h3{ margin:10px 0 6px; }
  .chk{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-top:1px solid var(--line); cursor:pointer; } .chk:first-of-type{ border-top:0; }
  .chk input{ width:22px; height:22px; flex:none; } .chk span{ flex:1; font-weight:600; } .chk .rate{ flex:none; font-weight:400; color:var(--muted); font-size:13px; }
  .comp .lbl{ display:block; margin:12px 0 4px; font-size:13px; color:var(--muted); }
  .inp{ width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  h3{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:18px 0 8px; }
  .picbtns{ display:flex; gap:8px; flex-wrap:wrap; } .picbtns label{ flex:1; min-width:140px; text-align:center; padding:12px 14px; border-radius:10px; border:1px solid var(--line); font-weight:600; cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:center; }
  .picbtns label.p{ background:var(--accent); border-color:var(--accent); color:#fff; } .picbtns input{ display:none; }
  .picbtns label.busy{ opacity:.5; pointer-events:none; }
  .pics{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin-top:10px; }
  .pic{ position:relative; border-radius:10px; overflow:hidden; background:var(--row); border:1px solid var(--line); aspect-ratio:1; }
  .pic img{ width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .pic span{ position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.55); color:#fff; font-size:11px; padding:2px 6px; }
  .lb{ position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; }
  .lb img{ max-width:100%; max-height:86vh; border-radius:8px; } .lb button{ margin-top:12px; }
  .done.tap{ cursor:pointer; }
  .done{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; } .done:last-child{ border-bottom:0; }
  .err{ text-align:center; padding:40px 10px; color:var(--bad); } .empty{ text-align:center; padding:28px; color:var(--muted); }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10161d; --card:#18212b; --ink:#e8eef5; --muted:#9aa9b9; --line:#2c3948; --accent:#3a9bbd; --row:#1d2833; --ok:#2f9a5e; --warn:#e0a63a; }
    .pill{ background:#2b3846; color:#cfd9e4; } .pill.go{ background:#17402a; color:#a5e3bf; } .pill.mid{ background:#4a3a10; color:#f5d98f; } .pill.bad{ background:#4a1d19; color:#f4b4ae; }
    .issue,.row-msg.bad,button.w{ color:#f4948c; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">Vendor Portal</h1>
  <p class="sub" id="sub">Your open services for Farmer Development</p>
  <div id="main"><div class="empty">Loading your services&hellip;</div></div>
</div>
<script src="config.js"></script>
<script>
(function(){
  const cfg = window.SNOW_CONFIG || {};
  const WORKER = String(cfg.workerUrl || '').replace(/\/$/, '');
  const qs = new URLSearchParams(location.search);
  const V = qs.get('v') || '', T = qs.get('t') || '';
  const main = document.getElementById('main');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const PILL = { 'Requested':'', 'Dispatched':'mid', 'Vendor Replied':'mid', 'On Site':'go', 'Issue':'bad', 'Completed':'go' };
  let data = null, openNote = null, tab = 'open', query = ''; // openNote = { rowId, action }
  let completeOpen = null;   // { rowId, picked:Set(labels), invoice } while the "what did you complete" panel is open
  const GENERIC_ITEMS = ['Push', 'Salt', 'Walks', 'Haul / Stack', 'Other'];

  function fail(msg){ main.innerHTML = `<div class="err">${esc(msg)}</div>`; }
  function fmtDate(s){
    if (!s) return '';
    const d = new Date(/^\d{4}-\d{2}-\d{2}$/.test(s) ? s + 'T12:00:00' : s);
    return isNaN(d) ? s : d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  const ET = { timeZone:'America/New_York' };
  function fmtET(s, short){
    if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return fmtDate(s) + (short ? '' : ', ' + s.slice(0, 4)) + ' (time not recorded)';
    const d = new Date(s); if (isNaN(d)) return s;
    const day = d.toLocaleDateString('en-US', Object.assign({ month:'short', day:'numeric' }, short ? {} : { year:'numeric' }, ET));
    const tm = d.toLocaleTimeString('en-US', Object.assign({ hour:'numeric', minute:'2-digit', timeZoneName:'short' }, ET));
    return day + ' at ' + tm;
  }
  const sel = () => { const m = location.hash.match(/^#s(\d+)/); return m ? Number(m[1]) : null; };
  const findSvc = id => (data.active || []).find(x => Number(x.rowId) === id) || (data.done || []).find(x => Number(x.rowId) === id) || null;
  let photos = { rowId: null, list: null, busy: false, msg: '', bad: false };
  const tel = p => String(p).replace(/[^\d+]/g, '');

  const money = n => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const itemsFor = o => (o.items && o.items.length) ? o.items : GENERIC_ITEMS.map(l => ({ label: l, rate: null }));
  function completeHtml(o){
    const c = completeOpen, items = itemsFor(o);
    return `<div class="comp"><h3>What did you complete?</h3>`
      + items.map(it => `<label class="chk"><input type="checkbox" data-item="${esc(it.label)}"${c.picked.has(it.label) ? ' checked' : ''}><span>${esc(it.label)}</span>${typeof it.rate === 'number' ? `<span class="rate">${money(it.rate)}</span>` : ''}</label>`).join('')
      + `<label class="lbl" for="comp-inv">Your invoice number (optional, you can add it later)</label><input id="comp-inv" class="inp" type="text" maxlength="40" value="${esc(c.invoice)}" placeholder="e.g. 10452" autocomplete="off">`
      + `<div class="acts"><button class="ok" data-act="completesend" data-id="${esc(o.rowId)}">Submit completed</button><button data-act="cancel">Cancel</button></div></div>`;
  }
  function billingHtml(o){
    return `<div class="comp"><h3>Billing</h3>`
      + (o.picked && o.picked.length ? `<div class="meta" style="margin-bottom:6px">Completed: ${esc(o.picked.join(', '))}</div>` : '')
      + (o.pushed ? `<div class="meta">Invoice # ${esc(o.invoice || '(none entered)')} &middot; already in billing</div>`
        : `<label class="lbl" for="inv-edit">Your invoice number</label><input id="inv-edit" class="inp" type="text" maxlength="40" value="${esc(o.invoice || '')}" placeholder="e.g. 10452" autocomplete="off"><div class="acts"><button class="p" data-act="invoicesave" data-id="${esc(o.rowId)}">Save invoice number</button></div>`)
      + `</div>`;
  }
  const mapBtn = o => o && o.mapUrl && /^https?:\/\//i.test(o.mapUrl) ? `<a class="mapbtn" href="${esc(o.mapUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Overhead Map</a>` : '';
  function cardHtml(o, detail){
    const maps = o.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}` : '';
    const rows = [];
    if (o.contact) rows.push(`<dt>On-site contact</dt><dd>${esc(o.contact)}</dd>`);
    if (o.phone) rows.push(`<dt>Phone</dt><dd><a href="tel:${esc(tel(o.phone))}">${esc(o.phone)}</a></dd>`);
    if (o.email) rows.push(`<dt>Email</dt><dd><a href="mailto:${esc(o.email)}">${esc(o.email)}</a></dd>`);
    if (o.gate) rows.push(`<dt>Gate code</dt><dd class="gate">${esc(o.gate)}</dd>`);
    if (o.combo) rows.push(`<dt>Snow gate combo</dt><dd class="gate">${esc(o.combo)}</dd>`);
    if (o.requests) rows.push(`<dt>Special requests</dt><dd style="font-weight:500;white-space:pre-wrap">${esc(o.requests)}</dd>`);
    const noteOpen = openNote && openNote.rowId === o.rowId;
    const live = o.status === 'Dispatched' || o.status === 'Vendor Replied' || o.status === 'On Site' || o.status === 'Issue';
    const tl = [['Requested', o.requestedAt], ['Dispatched', o.dispatchedAt], ['On site', o.onSiteAt], ['Completed', o.completedAt]].filter(x => x[1]);
    return `<div class="card${detail ? '' : ' tap'}" data-id="${esc(o.rowId)}"${detail ? '' : ` data-open="${esc(o.rowId)}"`}>
      <div class="top"><div class="store">${esc(o.store)}</div><span><span class="pill ${PILL[o.status] || ''}">${esc(o.status)}</span>${detail ? '' : '<span class="chev">&rsaquo;</span>'}</span></div>
      <div class="addr">${maps ? `<a href="${maps}" target="_blank" rel="noopener">${esc(o.address)}</a>` : ''}</div>
      ${mapBtn(o)}
      <div><span class="svc">${esc(o.service || 'Service')}</span>${o.serviceDate ? ` <span class="meta">&middot; ${esc(fmtDate(o.serviceDate))}</span>` : ''}</div>
      ${!detail && o.requestedAt ? `<div class="when">Requested ${esc(fmtET(o.requestedAt, true))}</div>` : ''}
      ${detail && tl.length ? `<div class="tl">${tl.map(x => `<div><span>${x[0]}</span><b>${esc(fmtET(x[1]))}</b></div>`).join('')}</div>` : ''}
      ${rows.length ? `<dl class="info">${rows.join('')}</dl>` : ''}
      ${o.issue ? `<div class="issue">Issue: ${esc(o.issue)}</div>` : ''}
      ${o.notes ? `<div class="notes">${esc(o.notes)}</div>` : ''}
      ${completeOpen && completeOpen.rowId === o.rowId && live ? completeHtml(o) : noteOpen ? `<textarea placeholder="${openNote.action === 'issue' ? 'What happened? (required)' : 'Add a note for Farmer Development'}"></textarea>
        <div class="acts"><button class="${openNote.action === 'issue' ? 'w' : 'p'}" data-act="send" data-id="${esc(o.rowId)}">${openNote.action === 'issue' ? 'Report issue' : 'Send note'}</button><button data-act="cancel">Cancel</button></div>`
      : (live ? `<div class="acts">
          ${o.status !== 'On Site' ? `<button class="p" data-act="onsite" data-id="${esc(o.rowId)}">I'm on site</button>` : ''}
          <button class="ok" data-act="complete" data-id="${esc(o.rowId)}">Completed</button>
          <button class="w" data-act="issue" data-id="${esc(o.rowId)}">Problem</button>
          <button data-act="note" data-id="${esc(o.rowId)}">Add note</button></div>` : '')}
      <div class="row-msg"></div>
      ${detail && o.status === 'Completed' ? billingHtml(o) : ''}
      ${detail ? '<h3>Photos</h3><div id="photos"></div>' : ''}
    </div>`;
  }

  function detailHtml(o){
    return '<button class="back" data-back="1">&lsaquo; All services</button>' + cardHtml(o, true);
  }
  const phUrl = (id) => `${WORKER}/vendor/photo?v=${encodeURIComponent(V)}&t=${encodeURIComponent(T)}&rowId=${photos.rowId}&id=${encodeURIComponent(id)}`;
  function paintPhotos(){
    const box = document.getElementById('photos'); if (!box) return;
    const list = photos.list || [];
    box.innerHTML = `<div class="picbtns"><label class="p${photos.busy ? ' busy' : ''}">Take photo<input id="pic-cam" type="file" accept="image/*" capture="environment"></label><label class="${photos.busy ? 'busy' : ''}">Upload photos<input id="pic-lib" type="file" accept="image/*" multiple></label></div>`
      + `<div class="row-msg${photos.bad ? ' bad' : ''}">${esc(photos.msg)}</div>`
      + (photos.list === null ? '<div class="meta">Loading photos\u2026</div>' : list.length ? `<div class="pics">${list.map(p => `<div class="pic"><img loading="lazy" alt="Service photo" data-full="${esc(p.id)}" src="${esc(phUrl(p.id))}"><span>${esc(fmtET(p.at, true).replace(/ at /, ' ').replace(/ [A-Z]{2,4}$/, ''))}</span></div>`).join('')}</div>` : '<div class="meta">No photos yet. Take one from the job site.</div>');
  }
  async function loadPhotos(id){
    if (photos.rowId !== id){ photos = { rowId: id, list: null, busy: false, msg: '', bad: false }; }
    paintPhotos();
    try {
      const r = await fetch(`${WORKER}/vendor/photos?v=${encodeURIComponent(V)}&t=${encodeURIComponent(T)}&rowId=${id}`);
      const j = await r.json().catch(() => ({}));
      if (photos.rowId !== id) return;
      if (!r.ok || !j.ok){ photos.list = photos.list || []; photos.msg = j.error || 'Could not load photos.'; photos.bad = true; } else { photos.list = j.photos || []; }
    } catch(e){ if (photos.rowId !== id) return; photos.list = photos.list || []; photos.msg = 'Could not load photos.'; photos.bad = true; }
    paintPhotos();
  }
  // shrink phone photos (about 1600px JPEG) so uploads are quick on cell service
  async function shrink(file){
    let bmp = null;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch(e){ try { bmp = await createImageBitmap(file); } catch(e2){ bmp = null; } }
    if (!bmp){ if (/^image\/(jpeg|png|webp)$/.test(file.type)) return file; throw new Error('Could not read that photo.'); }
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Could not read that photo.')), 'image/jpeg', 0.82));
  }
  async function uploadFiles(files){
    const id = photos.rowId; if (!id || !files.length || photos.busy) return;
    photos.busy = true; photos.bad = false; let ok = 0, fails = [];
    for (let i = 0; i < files.length; i++){
      photos.msg = `Uploading ${i + 1} of ${files.length}\u2026`; paintPhotos();
      try {
        const blob = await shrink(files[i]);
        const r = await fetch(`${WORKER}/vendor/photo?v=${encodeURIComponent(V)}&t=${encodeURIComponent(T)}&rowId=${id}`, { method:'POST', headers:{ 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j.error || 'Upload failed.');
        ok++;
      } catch(e){ fails.push(String((e && e.message) || e)); }
    }
    photos.busy = false; photos.bad = !!fails.length;
    photos.msg = fails.length ? `${ok ? ok + ' uploaded. ' : ''}${fails[0]}` : `${ok} photo${ok === 1 ? '' : 's'} uploaded.`;
    paintPhotos(); await loadPhotos(id);
  }

  function siteCard(s){
    const maps = s.address ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}` : '';
    const rows = [];
    if (s.contact) rows.push(`<dt>On-site contact</dt><dd>${esc(s.contact)}</dd>`);
    if (s.phone) rows.push(`<dt>Phone</dt><dd><a href="tel:${esc(tel(s.phone))}">${esc(s.phone)}</a></dd>`);
    if (s.email) rows.push(`<dt>Email</dt><dd><a href="mailto:${esc(s.email)}">${esc(s.email)}</a></dd>`);
    rows.push(`<dt>Gate code</dt>` + (s.gate ? `<dd class="gate">${esc(s.gate)}</dd>` : `<dd class="locked">None on file</dd>`));
    if (s.combo) rows.push(`<dt>Snow gate combo</dt><dd class="gate">${esc(s.combo)}</dd>`);
    if (s.requests) rows.push(`<dt>Special requests</dt><dd style="font-weight:500;white-space:pre-wrap">${esc(s.requests)}</dd>`);
    rows.push(`<dt>Overhead map</dt>` + (mapBtn(s) ? `<dd>${mapBtn(s)}</dd>` : `<dd class="locked">None on file</dd>`));
    return `<div class="card"><div class="top"><div class="store">${esc(s.store)}</div>${s.region ? `<span class="pill">${esc(s.region)}</span>` : ''}</div>
      <div class="addr">${maps ? `<a href="${maps}" target="_blank" rel="noopener">${esc(s.address)}</a>` : esc(s.address)}</div><dl class="info">${rows.join('')}</dl></div>`;
  }
  function sitesHtml(){
    const all = data.sites || [], q = query.trim().toLowerCase();
    const hit = q ? all.filter(s => [s.store, s.address, s.region, s.contact, s.phone, s.email, s.gate, s.combo, s.requests].join(' ').toLowerCase().includes(q)) : all;
    return `<input class="srch" id="srch" type="search" placeholder="Search store, address, contact, gate code\u2026" value="${esc(query)}" autocomplete="off">`
      + `<div class="meta" style="margin:-4px 2px 10px">${hit.length} of ${all.length} site${all.length === 1 ? '' : 's'}</div>`
      + (hit.length ? hit.map(siteCard).join('') : `<div class="card empty">${all.length ? 'No sites match that search.' : 'No sites are assigned to you yet.'}</div>`);
  }
  function render(){
    document.getElementById('ttl').textContent = data.vendor || 'Vendor Portal';
    const act = data.active || [], done = data.done || [];
    document.title = (data.vendor || 'Vendor') + ' – Portal';
    const sid = sel();
    if (sid){
      const o = findSvc(sid);
      if (o){ main.innerHTML = detailHtml(o); paintPhotos(); loadPhotos(sid); window.scrollTo(0, 0); return; }
      history.replaceState(null, '', location.pathname + location.search);
    }
    const nSites = (data.sites || []).length;
    const tabs = `<div class="tabs"><button data-tab="open" class="${tab === 'open' ? 'on' : ''}">Open services${act.length ? ' (' + act.length + ')' : ''}</button><button data-tab="sites" class="${tab === 'sites' ? 'on' : ''}">All my sites${nSites ? ' (' + nSites + ')' : ''}</button></div>`;
    if (tab === 'sites'){ const had = document.activeElement && document.activeElement.id === 'srch'; main.innerHTML = tabs + sitesHtml(); if (had){ const i = document.getElementById('srch'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
    main.innerHTML = tabs + '<h2>Open services' + (act.length ? ' (' + act.length + ')' : '') + '</h2>'
      + (act.length ? act.map(o => cardHtml(o)).join('') : '<div class="card empty">Nothing open right now. New requests show up here as soon as they are dispatched.</div>')
      + (done.length ? '<h2>Recently completed</h2><div class="card">' + done.map(o => `<div class="done tap" data-open="${esc(o.rowId)}"><div><b>${esc(o.store)}</b><div class="meta">${esc(o.service || '')}</div></div><div class="meta">${esc(fmtDate(o.serviceDate))}</div></div>`).join('') + '</div>' : '');
  }

  async function load(){
    if (!WORKER){ fail('This page is not connected yet.'); return; }
    if (!V || !T){ fail('This link is not valid. Ask Farmer Development for a new one.'); return; }
    try {
      const r = await fetch(`${WORKER}/vendor/portal?v=${encodeURIComponent(V)}&t=${encodeURIComponent(T)}`);
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok){ fail(j.error || 'Could not load your services right now.'); return; }
      data = j; render();
    } catch(e){ fail('Could not reach the server. Check your connection and refresh.'); }
  }

  async function send(id, action, note, card, extra){
    const msg = card.querySelector('.row-msg'); msg.className = 'row-msg'; msg.textContent = 'Saving…';
    card.querySelectorAll('button').forEach(b => { b.disabled = true; });
    try {
      const r = await fetch(WORKER + '/vendor/update', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(Object.assign({ v:V, t:T, rowId:Number(id), action, note: note || '' }, extra || {})) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'Could not save that.');
      openNote = null; completeOpen = null; await load();
    } catch(e){
      card.querySelectorAll('button').forEach(b => { b.disabled = false; });
      msg.className = 'row-msg bad'; msg.textContent = String((e && e.message) || e);
    }
  }

  main.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.item !== undefined && completeOpen){ if (e.target.checked) completeOpen.picked.add(e.target.dataset.item); else completeOpen.picked.delete(e.target.dataset.item); return; }
    if (e.target.id === 'pic-cam' || e.target.id === 'pic-lib'){ const fl = [...e.target.files]; e.target.value = ''; uploadFiles(fl); }
  });
  window.addEventListener('hashchange', () => { if (data) render(); });
  main.addEventListener('input', e => { if (e.target.id === 'srch'){ query = e.target.value; render(); } else if (e.target.id === 'comp-inv' && completeOpen){ completeOpen.invoice = e.target.value; } });
  main.addEventListener('click', e => {
    const tb = e.target.closest('button[data-tab]'); if (tb){ tab = tb.dataset.tab; render(); return; }
    if (e.target.closest('[data-back]')){ location.hash = ''; if (!sel()) render(); return; }
    const im = e.target.closest('img[data-full]');
    if (im){ const lb = document.createElement('div'); lb.className = 'lb'; lb.innerHTML = `<img alt=""><button>Close</button>`; lb.querySelector('img').src = im.src; lb.addEventListener('click', () => lb.remove()); document.body.appendChild(lb); return; }
    const op = e.target.closest('[data-open]');
    if (op && !e.target.closest('a, button, textarea, input, label')){ location.hash = 's' + op.dataset.open; return; }
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const card = b.closest('.card'), act = b.dataset.act, id = b.dataset.id;
    if (act === 'cancel'){ openNote = null; completeOpen = null; render(); return; }
    if (act === 'complete'){
      const o = findSvc(Number(id)); if (!o) return;
      const its = itemsFor(o), labels = new Set(its.map(i => i.label));
      const pre = new Set((o.picked || []).filter(l => labels.has(l)));
      if (!pre.size && (o.items || []).length === 1) pre.add(o.items[0].label);
      completeOpen = { rowId: o.rowId, picked: pre, invoice: o.invoice || '' }; openNote = null; render();
      const ci = main.querySelector('.comp'); if (ci && ci.scrollIntoView) ci.scrollIntoView({ block: 'nearest' }); return;
    }
    if (act === 'completesend'){
      if (!completeOpen) return;
      send(id, 'complete', '', card, { items: [...completeOpen.picked], invoice: (completeOpen.invoice || '').trim() }); return;
    }
    if (act === 'invoicesave'){
      const inv = ((card.querySelector('#inv-edit') || {}).value || '').trim();
      if (!inv){ const m = card.querySelector('.row-msg'); m.className = 'row-msg bad'; m.textContent = 'Enter your invoice number.'; return; }
      send(id, 'invoice', '', card, { invoice: inv }); return;
    }
    if (act === 'issue' || act === 'note'){ openNote = { rowId: Number(id) || id, action: act }; completeOpen = null; render(); const ta = main.querySelector('textarea'); if (ta) ta.focus(); return; }
    if (act === 'send'){
      const note = (card.querySelector('textarea') || {}).value || '';
      send(id, openNote.action, note.trim(), card); return;
    }
    send(id, act, '', card);
  });
  load();
})();
</script>
</body>
</html>
