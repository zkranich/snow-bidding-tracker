<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Request a Snow &amp; Ice Service</title>
<style>
  :root{ --bg:#f3f5f8; --card:#fff; --ink:#14202e; --muted:#5b6b7d; --line:#d5dce5; --accent:#1c6e8c; --accent-d:#14566f; --bad:#b3261e; --ok:#1e7a46; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap{ max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1{ font-size:22px; margin:8px 0 2px; }
  .sub{ color:var(--muted); margin:0 0 18px; font-size:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; }
  label,.lbl{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  label:first-child,.lbl:first-child{ margin-top:0; }
  select,input,textarea{ width:100%; font:inherit; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  textarea{ min-height:96px; resize:vertical; }
  select:focus,input:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .opts{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opt{ position:relative; }
  .opt input{ position:absolute; opacity:0; inset:0; width:100%; height:100%; cursor:pointer; }
  .opt span{ display:block; text-align:center; padding:12px 8px; border:1px solid var(--line); border-radius:8px; font-weight:600; font-size:15px; background:#fff; }
  .opt input:checked + span{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .opt input:focus-visible + span{ outline:2px solid var(--accent); outline-offset:2px; }
  button.go{ width:100%; margin-top:20px; padding:14px; font:inherit; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button.go:hover{ background:var(--accent-d); } button.go:disabled{ opacity:.6; cursor:default; }
  .msg{ margin-top:12px; font-size:14px; } .msg.bad{ color:var(--bad); }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .done{ text-align:center; padding:12px 4px; } .done .tick{ font-size:44px; color:var(--ok); line-height:1; }
  .done h2{ margin:10px 0 6px; font-size:20px; } .done p{ color:var(--muted); margin:0 0 16px; }
  .link{ background:none; border:0; color:var(--accent); font:inherit; font-weight:600; cursor:pointer; padding:0; text-decoration:underline; }
  .foot{ text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
  .err{ text-align:center; padding:28px 8px; color:var(--bad); }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10161d; --card:#18212b; --ink:#e8eef5; --muted:#9aa9b9; --line:#2c3948; --accent:#3a9bbd; --accent-d:#2d84a3; }
    select,input,textarea,.opt span{ background:#101820; color:var(--ink); }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Request a snow &amp; ice service</h1>
  <p class="sub" id="who">Farmer Development</p>
  <div class="card" id="card"><div class="sub" style="margin:0">Loading your sites&hellip;</div></div>
  <div class="foot">For emergencies or anything urgent, please also call your Farmer Development project manager.</div>
</div>
<script src="config.js"></script>
<script>
(function(){
  const cfg = window.SNOW_CONFIG || {};
  const WORKER = String(cfg.workerUrl || '').replace(/\/$/, '');
  const qs = new URLSearchParams(location.search);
  const C = qs.get('c') || '', T = qs.get('t') || '';
  const card = document.getElementById('card');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  let sites = [];

  function fail(m){ card.innerHTML = '<div class="err">' + esc(m) + '</div>'; }

  async function load(){
    if (!WORKER){ return fail('This page is not set up yet. Please contact Farmer Development.'); }
    if (!C || !T){ return fail('This link is incomplete. Please use the full link Farmer Development sent you.'); }
    try {
      const r = await fetch(WORKER + '/portal/sites?c=' + encodeURIComponent(C) + '&t=' + encodeURIComponent(T));
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) return fail(d.error || 'We could not load your sites right now. Please try again in a minute.');
      sites = d.sites || [];
      document.getElementById('who').textContent = 'Farmer Development · ' + C;
      if (!sites.length) return fail('There are no active sites on your account yet. Please contact Farmer Development.');
      form();
    } catch(e){ fail('We could not reach the service. Please check your connection and try again.'); }
  }

  function form(note){
    card.innerHTML = `
      <form id="f" autocomplete="on" novalidate>
        <label for="store">Site</label>
        <select id="store" required>${sites.length > 1 ? '<option value="">Choose a site&hellip;</option>' : ''}${sites.map(s => `<option value="${esc(s.store)}">${esc(s.store)}${s.address ? ' — ' + esc(s.address) : ''}</option>`).join('')}</select>
        <div class="lbl" style="margin-top:14px">Service needed</div>
        <div class="opts" id="svc">
          ${['Plow','Salt','Plow + Salt','Other'].map((o, i) => `<label class="opt" style="margin:0"><input type="radio" name="service" value="${esc(o)}"${i === 0 ? ' checked' : ''}><span>${esc(o)}</span></label>`).join('')}
        </div>
        <label for="notes">Details <span style="font-weight:400;color:var(--muted)">(where, what you&rsquo;re seeing, anything we should know)</span></label>
        <textarea id="notes" maxlength="1000"></textarea>
        <label for="name">Your name</label>
        <input id="name" autocomplete="name" maxlength="80" required>
        <label for="contact">Your phone or email</label>
        <input id="contact" autocomplete="tel" maxlength="120" required>
        <div class="hp" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div>
        <button class="go" id="go" type="submit">Submit request</button>
        <div class="msg bad" id="msg" role="alert">${esc(note || '')}</div>
      </form>`;
    document.getElementById('f').addEventListener('submit', submit);
  }

  async function submit(ev){
    ev.preventDefault();
    const msg = document.getElementById('msg'), go = document.getElementById('go');
    const v = id => document.getElementById(id).value.trim();
    const svc = (document.querySelector('input[name=service]:checked') || {}).value || '';
    if (!v('store')) return void (msg.textContent = 'Please choose a site.');
    if (!v('name') || !v('contact')) return void (msg.textContent = 'Please enter your name and a phone number or email so we can reach you.');
    msg.textContent = ''; go.disabled = true; go.textContent = 'Sending…';
    try {
      const r = await fetch(WORKER + '/portal/request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ c: C, t: T, store: v('store'), service: svc, notes: v('notes'), name: v('name'), contact: v('contact'), website: v('website') }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok){ msg.textContent = d.error || 'We could not send your request. Please try again or call us.'; go.disabled = false; go.textContent = 'Submit request'; return; }
      const store = v('store');
      card.innerHTML = `<div class="done"><div class="tick">&#10003;</div><h2>Request received</h2><p>We&rsquo;ve logged your ${esc(svc)} request for ${esc(store)} and our team will follow up with you shortly.</p><button class="link" id="again" type="button">Submit another request</button></div>`;
      document.getElementById('again').addEventListener('click', () => form());
    } catch(e){ msg.textContent = 'We could not reach the service. Please check your connection and try again.'; go.disabled = false; go.textContent = 'Submit request'; }
  }
  load();
})();
</script>
</body>
</html>
